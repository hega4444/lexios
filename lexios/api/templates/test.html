<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Preview</title>
</head>
<body>

<input type="text" id="linkInput" placeholder="Enter a URL">
<button onclick="previewFavicon()">Preview Favicon</button>

<div id="preview">
    <h2>Favicon Preview</h2>
    <img id="faviconImage" alt="Favicon">
</div>

<script>
        async function previewFavicon() {
            const url = linkInput.value;

            try {
                // Use cors-anywhere proxy to fetch the content
                const corsProxyUrl = 'https://cors-anywhere.herokuapp.com/';
                const proxyUrl = corsProxyUrl + url;

                const response = await fetch(proxyUrl);
                const htmlContent = await response.text();

                // Extract favicon URL using a regular expression
                const faviconUrl = extractFaviconUrl(htmlContent);

                // Display the favicon image
                const faviconImage = document.getElementById('faviconImage');
                faviconImage.src = faviconUrl;

            } catch (error) {
                console.error("Error fetching favicon:", error);
            }
        }

</script>

</body>
</html>
